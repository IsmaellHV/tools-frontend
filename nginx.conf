server {
  listen 80;
  listen [::]:80;
  server_name _;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  root /usr/share/nginx/html;

  # Hashed Astro assets — long cache
  location ~* /tools/_astro/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Static long-cache assets
  location ~* \.(?:css|js|svg|gif|png|jpg|jpeg|ico|woff2?|eot|ttf|otf|webp|mp4|webm)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA-ish fallback for unknown /tools/* paths → serve /tools/index.html
  location /tools/ {
    try_files $uri $uri/ $uri.html /tools/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  # Bare /tools (no slash) → redirect to /tools/
  location = /tools {
    return 301 /tools/;
  }

  # Anything else outside /tools just hits the parent proxy / 404s here
  location / {
    return 404;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
